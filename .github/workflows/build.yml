name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create releases + push version.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build Debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/embassy-monitor-v${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Embassy Monitor v${{ github.run_number }}"
          body: |
            🤖 Auto-build #${{ github.run_number }}
            
            **Install করার নিয়ম:**
            1. `embassy-monitor-v${{ github.run_number }}.apk` download করুন
            2. Phone-এ Settings → Unknown apps → Allow করুন
            3. APK install করুন
          files: release/embassy-monitor-v${{ github.run_number }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json
        run: |
          cat > version.json << EOF
          {
            "version_code": ${{ github.run_number }},
            "version_name": "v${{ github.run_number }}",
            "apk_url": "https://github.com/${{ github.repository }}/releases/latest/download/embassy-monitor-v${{ github.run_number }}.apk",
            "release_notes": "Build #${{ github.run_number }} — JSON monitoring, predictions, history, in-app update"
          }
          EOF
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add version.json
          git diff --staged --quiet || git commit -m "ci: update version.json to build ${{ github.run_number }} [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: embassy-monitor-v${{ github.run_number }}
          path: release/embassy-monitor-v${{ github.run_number }}.apk
          retention-days: 90
